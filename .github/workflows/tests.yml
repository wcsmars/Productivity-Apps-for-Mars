name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        app: [mars-momentum, mars-focus, mars-calendar]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: ./tests/run.sh
        working-directory: ${{ matrix.app }}
